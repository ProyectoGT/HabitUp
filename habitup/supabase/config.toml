# =====================================================
# Supabase CLI Configuration — HabitUp
# Local development:  supabase start
# Remote linking:     supabase link --project-ref <id>
# Generate types:     supabase gen types typescript --local > database.types.ts
# =====================================================

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ── Edge Functions ──────────────────────────────────
[functions.send-push-notification]
verify_jwt = false

# ── Storage buckets ─────────────────────────────────
# Uncomment and configure after creating buckets manually:
# [storage.buckets.photos]
# public = false
# file_size_limit = 10485760
# allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# ── Custom SMTP (production only) ───────────────────
# [auth.smtp]
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "your-sendgrid-api-key"
# admin_email = "noreply@habitup.app"
# sender_name = "HabitUp"
